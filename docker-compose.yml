# One command to a working portal:
#
#     docker compose up --build
#
# No .env file is needed: every variable has a working default below. Copy .env.example to
# .env only to override something. At runtime nothing leaves the compose network.

name: dogfood-portal

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dogfood}
      POSTGRES_USER: ${POSTGRES_USER:-dogfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dogfood}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dogfood} -d ${POSTGRES_DB:-dogfood}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Port 5432 is deliberately not published. Use `docker compose exec db psql -U dogfood`.

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-dogfood}
      POSTGRES_USER: ${POSTGRES_USER:-dogfood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dogfood}
      # Empty = the entrypoint generates a random key on first boot into the `secrets` volume
      # (never the repo) and reuses it on every restart. Set your own for a real deployment.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_SECRET_KEY_FILE: /app/secrets/secret_key
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1],web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      # 1 = one demo account per role, published password, fixed API tokens. Never in production.
      DEMO_MODE: ${DEMO_MODE:-1}
      # Import the organizers' fixture dataset on boot (create-only, idempotent). The gallery
      # shows its projects. Set 0 for a real deployment.
      SEED_FIXTURES: ${SEED_FIXTURES:-1}
      FIXTURES_PATH: /app/acceptance/fixtures.json
      DEMO_PASSWORD: ${DEMO_PASSWORD:-dogfood-demo}
      # Fixed so .dogfood.toml keeps working across `docker compose down -v`. No `#` allowed.
      DEMO_TOKEN_ADMIN: ${DEMO_TOKEN_ADMIN:-dogfood-demo-admin-token}
      DEMO_TOKEN_ORGANIZER: ${DEMO_TOKEN_ORGANIZER:-dogfood-demo-organizer-token}
      DEMO_TOKEN_JUDGE_A: ${DEMO_TOKEN_JUDGE_A:-dogfood-demo-judge-a-token}
      DEMO_TOKEN_JUDGE_B: ${DEMO_TOKEN_JUDGE_B:-dogfood-demo-judge-b-token}
      DEMO_TOKEN_PARTICIPANT: ${DEMO_TOKEN_PARTICIPANT:-dogfood-demo-participant-token}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8080}
    volumes:
      # Uploaded project images. A named volume, so they survive rebuilds and the non-root
      # container user owns it. `docker compose down -v` deletes it with the database.
      - media:/app/media
      # The generated SECRET_KEY (see config/secret_key.py). Deleted by `docker compose down -v`.
      - secrets:/app/secrets
      # The organizers' file, read-only, straight from the repo: the container imports exactly
      # the file that is committed, and cannot modify it.
      - ./acceptance/fixtures.json:/app/acceptance/fixtures.json:ro
    ports:
      - "${PORTAL_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  media:
  secrets:
