# Where the acceptance checker finds things.   python acceptance/run.py .dogfood.toml

[portal]
base_url = "http://localhost:8080"

[tiers]
# Claimed because every check of both tiers passes for real (see acceptance-report.txt): the
# three T1 checks and the four T2 checks (own scores, peer scores refused, participant refused,
# CSV export).
claimed = ["T1", "T2"]
pitch = "A self-hosted hackathon portal with a server-guarded portal per role, a deadline enforced by both the server and a Postgres trigger, and a searchable public gallery."

[auth]
# Bearer tokens seeded at boot when DEMO_MODE=1 (values from docker-compose.yml).
organizer   = "Authorization: Bearer dogfood-demo-organizer-token"
judge_a     = "Authorization: Bearer dogfood-demo-judge-a-token"
judge_b     = "Authorization: Bearer dogfood-demo-judge-b-token"
participant = "Authorization: Bearer dogfood-demo-participant-token"

[routes]
# Built: the public gallery (submitted projects of published events; fixture data imported on boot).
gallery      = "/projects"
# Built. "Dogfood Archive 2026" is seeded closed, so this POST is refused by the deadline check
# with 409 {"error": "submissions_closed", ...} -- not by a 404 or a permission error.
submit       = "/api/events/dogfood-archive-2026/projects"
# Built (T2), and claimed: all four T2 checks pass.
judge_scores = "/api/judge/scores"
# judge_a's real account (seed_demo), so judge_b's 403 means "a peer", not "no such judge".
peer_scores  = "/api/judge/scores?judge=judge.a@dogfood.local"
csv_export   = "/api/export.csv"
