[pytest]
# Settings precedence in pytest-django is: --ds on the command line, then the
# DJANGO_SETTINGS_MODULE environment variable, then this ini value. The Dockerfile exports
# DJANGO_SETTINGS_MODULE=config.settings for manage.py and gunicorn, which would otherwise
# win here and run the suite against production settings. Passing --ds through addopts puts
# the choice at the highest-precedence level, so the suite uses test settings no matter what
# the surrounding environment says.
DJANGO_SETTINGS_MODULE = config.settings_test

python_files = test_*.py
testpaths = tests

# `src` on the path so `import core`, `import accounts` resolve exactly as they do under
# manage.py, with no packaging step.
pythonpath = src

addopts = --ds=config.settings_test --strict-markers -ra

filterwarnings =
    error::DeprecationWarning:accounts.*
    error::DeprecationWarning:core.*
    error::DeprecationWarning:events.*
    error::DeprecationWarning:teams.*
    error::DeprecationWarning:projects.*
    error::DeprecationWarning:gallery.*
    error::DeprecationWarning:api.*
