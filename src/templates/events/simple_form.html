{% extends "base.html" %}

{% block title %}{{ title }} · {{ event.name }}{% endblock %}

{% block content %}
  <h1>{{ title }}</h1>
  <p class="muted">{{ event.name }}</p>

  <form method="post">
    {% csrf_token %}
    {% include "_form.html" %}
    <button type="submit">Save</button>
    <a href="/events/{{ event.slug }}/manage" role="button" class="secondary outline">Cancel</a>
  </form>
{% endblock %}
