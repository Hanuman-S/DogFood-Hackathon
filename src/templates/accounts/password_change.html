{% extends "base.html" %}

{% block title %}Change password · {{ portal_name }}{% endblock %}

{% block content %}
  <article>
    <h1>Change password</h1>

    <form method="post" action="/profile/password">
      {% csrf_token %}
      {% include "_form.html" %}
      <button type="submit">Change password</button>
    </form>

    <p><a href="/profile">Back to profile</a></p>
  </article>
{% endblock %}
