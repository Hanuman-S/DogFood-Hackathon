{# The modules a portal will host, shown while they are being built. #}
<p class="section-title">modules</p>
<div class="table-wrap">
<table class="table">
  <tbody>
  {% for name, what in modules %}
    <tr><td class="bright">{{ name }}</td><td class="dim">{{ what }}</td><td class="num faint">[ pending ]</td></tr>
  {% endfor %}
  </tbody>
</table>
</div>
